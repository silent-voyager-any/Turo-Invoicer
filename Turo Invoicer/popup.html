<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Turo Toll Reconciler</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div><p class="eyebrow">LOCAL RECONCILIATION</p><h1>Toll matcher</h1></div>
        <span id="statusDot" class="status-dot" aria-hidden="true"></span>
      </header>
      <p class="privacy-note">Open the persistent dashboard to configure a fleet without losing text when you switch tabs.</p>
      <section class="source-grid" aria-label="Saved data">
        <div><span>Turo trips</span><strong id="tripCount">0</strong></div>
        <div><span>E-ZPass tolls</span><strong id="tollCount">0</strong></div>
      </section>
      <button id="openDashboard" class="primary" type="button">Open fleet dashboard</button>
      <button id="syncButton" type="button">Sync open tabs</button>
      <p id="status" class="status" role="status" aria-live="polite">Loading…</p>
      <footer><span id="lastSync">Never synced</span></footer>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
